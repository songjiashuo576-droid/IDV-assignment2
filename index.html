    <script>
      let curveData=""
      for (let i = 0; i <= 200; i++)
      {let x = -10+i*0.1;
      let value= 1/(1+Math.exp(-x));
      let svgX = 70 + (x + 10)*24 
      let svgY = 370-value*325;
      if (i===0){
        curveData += "M" + svgX+ " " +svgY + " ";
      } else {
        curveData += "L" + svgX + " " + svgY + " ";
      }
      }
      document.getElementById("sigmoid-curve")
          .setAttribute("d", curveData);
